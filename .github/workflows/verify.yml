name: Verify Ubuntu
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and package Ubuntu
        run: bash scripts/package.sh
      - name: H2 isolated identity HTTP regression
        run: python3 scripts/identity-smoke.py
      - name: Prepare verified private Linux PostgreSQL17 binaries
        run: |
          set -euo pipefail
          python3 scripts/ubuntu-download-pg.py --tools "$PWD/.tools/linux"
          bash scripts/prepare-postgres.sh "$PWD/.tools/linux/downloads/embedded-postgres-binaries-linux-amd64-17.11.0.jar" 0dd7b72b6f335b8ecfb355fa24c5781e8a93edd09880bb77eb52ebbf29b3e96d
      - name: PostgreSQL17 isolated identity HTTP regression
        run: python3 scripts/identity-smoke.py --storage postgresql
